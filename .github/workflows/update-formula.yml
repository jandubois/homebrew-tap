name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to update"
        required: true
        type: choice
        options:
          - git-lint
          - hyperlink
          - monitor
          - nobin
          - rss-feed
          - web-receipts
      version:
        description: "Version (e.g. 0.2.0). Leave blank to use latest release."
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        env:
          FORMULA: ${{ github.event.inputs.formula || github.event.client_payload.formula }}
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "jandubois/$FORMULA" --json tagName --jq '.tagName' | sed 's/^v//')
          fi
          echo "formula=$FORMULA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: ./scripts/update-formula.sh "${{ steps.resolve.outputs.formula }}" "${{ steps.resolve.outputs.version }}"

      - name: Commit and push
        env:
          FORMULA: ${{ steps.resolve.outputs.formula }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update $FORMULA to $VERSION"
          git push
